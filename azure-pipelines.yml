trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildOutput: 'dist'
  nodeVersion: '16.x'

steps:
  - script: |
      echo "Installing dependencies..."
      npm install
    displayName: 'Install dependencies'

  - script: |
      echo "Building the web app..."
      npx expo export -p web --output-dir $(buildOutput)
    displayName: 'Build Expo Web App'

  - task: AzureStaticWebApp@0
    inputs:
      app_location: $(buildOutput)
      output_location: ''
      azure_static_web_apps_api_token: $(deployment_token)