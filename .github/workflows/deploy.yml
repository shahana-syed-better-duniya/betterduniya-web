name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ website-development ]
  pull_request:
    branches: [ website-development ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Build Expo Web App
      run: npm run build
      env:
        BACKEND_URL: ${{ secrets.BACKEND_URL }}
        BACKEND_URL_PROD: ${{ secrets.BACKEND_URL_PROD }}
        BACKEND_URL_TEST: ${{ secrets.BACKEND_URL_TEST }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/website-development'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: your-custom-domain.com  # Optional: replace with your domain