name: Deploy to betterduniya.com

on:
  push:
    branches: [ website-development ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: 🚚 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🧪 Run Tests
      run: npm test

    - name: 🔨 Build Application
      run: npm run build
      env:
        BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://api.betterduniya.com' }}
        BACKEND_URL_PROD: ${{ secrets.BACKEND_URL_PROD || 'https://api.betterduniya.com' }}
        BACKEND_URL_TEST: ${{ secrets.BACKEND_URL_TEST || 'https://test-api.betterduniya.com' }}

    - name: 📂 List Build Files
      run: ls -la dist/

    - name: � Setup Pages
      uses: actions/configure-pages@v3

    - name: 📦 Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './dist'

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2