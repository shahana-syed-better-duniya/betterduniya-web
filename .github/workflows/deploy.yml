name: Deploy to betterduniya.com

on:
  push:
    branches: [ website-development ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to GoDaddy
    
    steps:
    - name: 🚚 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🧪 Run Tests
      run: npm test

    - name: 🔨 Build Application
      run: npm run build
      env:
        BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://api.betterduniya.com' }}
        BACKEND_URL_PROD: ${{ secrets.BACKEND_URL_PROD || 'https://api.betterduniya.com' }}
        BACKEND_URL_TEST: ${{ secrets.BACKEND_URL_TEST || 'https://test-api.betterduniya.com' }}

    - name: 📂 List Build Files
      run: ls -la dist/

    - name: 🚀 Deploy to GoDaddy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: /public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          **/Thumbs.db